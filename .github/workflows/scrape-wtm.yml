name: Scrape WTM (daily list)

on:
  schedule:
    - cron: "5 0 * * *"      # 00:05 UTC = 08:05 WITA
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scrape-wtm
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Build date list (H+0..H+7, WITA)
        id: dates
        run: |
          DATES="$(node -e '
            const pad = n => String(n).padStart(2, "0");
            const p = new Intl.DateTimeFormat("en-CA", {
              timeZone: "Asia/Makassar",
              year: "numeric", month: "2-digit", day: "2-digit"
            }).formatToParts(new Date());
            const g = t => +p.find(x => x.type === t).value;
            const base = new Date(g("year"), g("month") - 1, g("day"));
            const out = [];
            for (let i = 0; i <= 7; i++) {
              const d = new Date(base);
              d.setDate(d.getDate() + i);
              out.push(`${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}`);
            }
            console.log(out.join(" "));
          ')"
          echo "list=$DATES" >> "$GITHUB_OUTPUT"
          echo "Dates: $DATES"

      - name: Run scraper
        run: node src/scrape-wtm.js ${{ steps.dates.outputs.list }}

      - name: Commit results.csv
        run: |
          if git diff --quiet -- results.csv; then
            echo "No changes."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results.csv
          git commit -m "chore(data): update WTM results"
          git push

      - name: Push schedule to aggregator
        shell: bash
        env:
          DASHBOARD_INGEST_URL: https://schedule.jerconetwork.com/api/ingest/v2
          DASHBOARD_INGEST_TOKEN: ${{ secrets.DASHBOARD_INGEST_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${DASHBOARD_INGEST_TOKEN:-}" ]; then
            echo "Missing required GitHub secret: DASHBOARD_INGEST_TOKEN" >&2
            exit 1
          fi
          node scripts/push-ingest.mjs
